# Relógio grátis: a cada hora chama o dashboard na Vercel, que busca notícias novas
# e publica no Instagram o que estiver no horário. (O cron da Vercel Hobby só roda 1x por dia.)
name: tick
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron
        run: |
          code=$(curl -sS -m 90 -o out.json -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron")
          cat out.json; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }
